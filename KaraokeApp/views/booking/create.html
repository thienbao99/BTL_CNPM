{% extends "layout/base.html" %}
{% block title %}Đặt phòng hát{% endblock %}
{% block content %}
<h1>Đặt phòng hát</h1>
<form method="post" class="form">
  <label>Họ tên khách hàng<input name="customer_name" required></label>
  <label>Số điện thoại<input name="customer_phone"></label>
  <label>Phòng hát<select name="room_id" required>{% for room in rooms %}<option value="{{ room.id }}">{{ room.room_name }} – {{ room.hourly_price }} đ/giờ</option>{% endfor %}</select></label>
  <label>Số lượng khách<input type="number" name="guest_count" min="1" max="15" required></label>
  <label>Thời gian bắt đầu<input type="datetime-local" name="start_time" required></label>
  <label>Thời gian kết thúc<input type="datetime-local" name="end_time" required></label>
  <button type="submit">Xác nhận đặt phòng</button>
</form>
{% endblock %}
